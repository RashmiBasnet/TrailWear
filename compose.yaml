name: trailwear

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailwear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trailwear}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trailwear}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trailwear}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-off: creates the premade admin once the schema is in place. Reuses the
  # runner image (which already holds the compiled dist and argon2), overrides
  # the command, and reads credentials from backend/.env. The DATABASE_URL there
  # points at the host's local Postgres, so it is overridden to reach the `db`
  # service on the compose network. Idempotent, so it is safe on every `up`.
  seed-admin:
    build:
      context: ./backend
      target: runner
    command: ["node", "dist/scripts/seedAdmin.js"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trailwear}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trailwear}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # One-off: creates the premade customer accounts. Same setup as seed-admin.
  seed-users:
    build:
      context: ./backend
      target: runner
    command: ["node", "dist/scripts/seedUsers.js"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trailwear}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trailwear}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      LOG_TO_CONSOLE: "true"
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trailwear}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trailwear}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      CLIENT_URL: ${CLIENT_URL:-https://localhost:3000}
      # Serve the API over TLS with the shared mkcert-issued certificate mounted
      # at /certs. NODE_EXTRA_CA_CERTS makes this process trust that CA so the
      # container healthcheck's HTTPS fetch to itself verifies.
      SSL_KEY_PATH: /certs/localhost-key.pem
      SSL_CERT_PATH: /certs/localhost.pem
      NODE_EXTRA_CA_CERTS: /certs/rootCA.pem
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost:3000/api/auth/google/callback}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-8gBm/:&EnhH.1/q}
      ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:-EPAYTEST}
      ESEWA_FORM_URL: ${ESEWA_FORM_URL:-https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      ESEWA_STATUS_URL: ${ESEWA_STATUS_URL:-https://rc.esewa.com.np/api/epay/transaction/status/}
    volumes:
      - ./certs:/certs:ro
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('https://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      # The backend now serves HTTPS on the internal network. NODE_EXTRA_CA_CERTS
      # lets this process verify the backend's mkcert-issued cert on its
      # server-side calls; SSL_*_PATH make server-https.mjs terminate TLS itself.
      API_BASE_URL: https://backend:5000
      SSL_KEY_PATH: /certs/localhost-key.pem
      SSL_CERT_PATH: /certs/localhost.pem
      NODE_EXTRA_CA_CERTS: /certs/rootCA.pem
    volumes:
      - ./certs:/certs:ro
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
  backend_logs:
